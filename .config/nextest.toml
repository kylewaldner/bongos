[profile.default]
# A test running past 60 s is reported as slow; after 10 periods (10 minutes) it is killed
# and reported as TIMEOUT. A randomized editor test legitimately took 237 s in the full run, and
# under load 300 s is too tight.
slow-timeout = { period = "60s", terminate-after = 10 }
fail-fast = false
retries = 0
status-level = "fail"
final-status-level = "slow"

# Timing tests run one at a time so they do not disturb each other's measurements.
[test-groups]
perf-timing = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(bongos_minibuffer_model) & test(perf_tests::)"
test-group = "perf-timing"
# Wall-clock budgets flake on a loaded machine; a real regression fails all 4 attempts.
retries = 3

# Tests known to be flaky on a loaded machine. Each one passes when run alone and fails only
# occasionally when the whole suite runs in parallel. A test that passes on a retry is reported by
# nextest as FLAKY (not failed) and the run stays green; every other test keeps `retries = 0`, so an
# unexpected failure is still loud. Remove a test from this block when it is fixed, and give every
# new entry a reason in the list below.
#
# The failures come from momentary overload, so the retry waits 2 s first (an immediate retry would
# hit the same overload) and there are 2 retries (3 attempts): a real regression fails all of them.
# These tests are not measuring time, so they are not in the serial `perf-timing` group.
#
#   bongos_linear refresh_tests: asserts a count that is off by one when a refresh lands late.
#   bongos_kotlin crash_after_exits_nonzero...: the fake server exits on a fixed 200 ms timer started
#     at spawn, and the test needs the `initialize` reply inside that window.
#   bongos_kotlin test_progress_drives_indexing_then_ready: polls a real subprocess with a 15 s
#     wall-clock limit.
#   db test_simultaneous_db_corruption: times out after 15 s while parking under load.
#   editor test_tab_in_leading_whitespace_auto_indents_for_bash, test_markdown_indents: depend on
#     background syntax parsing and auto-indent finishing in time.
#   languages test_outline_with_destructuring: depends on background syntax parsing finishing in time.
#   bongos_chat test_no_output_makes_a_chat_idle: runs a fake CLI in a real PTY with 1 s wall-clock
#     bounds.
[[profile.default.overrides]]
filter = '''
(package(=bongos_linear) & test(=refresh_tests::the_window_skips_recent_reads_and_the_command_ignores_it))
| (binary_id(=bongos_kotlin::fake_kotlin_server) & test(=crash_after_exits_nonzero_and_leaves_its_pid_file))
| (binary_id(=bongos_kotlin::lifecycle) & test(=test_progress_drives_indexing_then_ready))
| (package(=db) & test(=tests::test_simultaneous_db_corruption))
| (package(=editor) & (test(=editor_tests::test_tab_in_leading_whitespace_auto_indents_for_bash) | test(=editor_tests::test_markdown_indents)))
| (package(=languages) & test(=typescript::tests::test_outline_with_destructuring))
| (package(=bongos_chat) & test(=runtime_tests::test_no_output_makes_a_chat_idle))
'''
retries = { backoff = "fixed", count = 2, delay = "2s" }
