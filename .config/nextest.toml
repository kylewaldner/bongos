nextest-version = { required = "0.9.146" }

[profile.default]
# A test running past 60 s is reported as slow; after 10 periods (10 minutes) it is killed
# and reported as TIMEOUT. A randomized editor test legitimately took 237 s in the full run, and
# under load 300 s is too tight.
slow-timeout = { period = "60s", terminate-after = 10 }
fail-fast = false
retries = 0
status-level = "fail"
final-status-level = "slow"

# Timing tests run one at a time so they do not disturb each other's measurements.
[test-groups]
perf-timing = { max-threads = 1 }

# Every wall-clock test belongs here, so it never shares the machine with another timing test. This
# filter is the perf set. It appears three times and the copies must stay identical: here, negated in
# `default-filter` of `[profile.gate]`, and as is in `default-filter` of `[profile.perf]`. Both
# profiles are below.
#   bongos_minibuffer_model, bongos_isearch perf_tests: millisecond budgets on the best of several runs.
#   bongos_workflow: stopping a process group that ignores SIGTERM must take at least the 2 s grace
#     and less than 5 s; the gate test asserts a 1 s budget.
# Wall-clock budgets flake on a loaded machine; the retry waits 1 s first (an immediate retry would
# hit the same load), and a real regression fails all 4 attempts.
[[profile.default.overrides]]
filter = '''
(package(=bongos_minibuffer_model) & test(perf_tests::))
| (package(=bongos_isearch) & test(perf_tests::))
| (package(=bongos_workflow) & (test(=runtime_tests::halt_ends_a_child_that_ignores_sigterm_within_five_seconds) | test(=runtime_tests::cancel_stops_processes_and_closes_the_run) | test(=runtime_tests::stop_kills_a_child_left_in_the_group_when_the_leader_exits_on_sigterm) | test(=runtime_tests::an_orphan_group_is_killed_even_when_its_leader_exits_on_sigterm) | test(=lifecycle_tests::gates_tests::a_gate_shows_needs_you_on_the_leaf_and_every_ancestor_while_another_branch_runs)))
'''
test-group = "perf-timing"
retries = { backoff = "fixed", count = 3, delay = "1s" }

# Tests known to be flaky on a loaded machine. Each one passes when run alone and fails only
# occasionally when the whole suite runs in parallel. A test that passes on a retry is reported by
# nextest as FLAKY (not failed) and the run stays green; every other test keeps `retries = 0`, so an
# unexpected failure is still loud. Remove a test from this block when it is fixed, and give every
# new entry a reason in the list below.
#
# The failures come from momentary overload, so the retry waits 2 s first (an immediate retry would
# hit the same overload) and there are 2 retries (3 attempts): a real regression fails all of them.
# These tests are not measuring time, so they are not in the serial `perf-timing` group.
#
#   db test_simultaneous_db_corruption: times out after 15 s while parking under load.
#   editor test_tab_in_leading_whitespace_auto_indents_for_bash, test_markdown_indents: depend on
#     background syntax parsing and auto-indent finishing in time.
#   editor test_indent_after_input_for_bash: sets the bash grammar on the buffer and then waits for
#     the auto-indent task (which needs the background syntax parse) to apply before asserting.
#   languages test_outline_with_destructuring: depends on background syntax parsing finishing in time.
#   bongos_chat test_no_output_makes_a_chat_idle: runs a fake CLI in a real PTY with 1 s wall-clock
#     bounds.
[[profile.default.overrides]]
filter = '''
(package(=db) & test(=tests::test_simultaneous_db_corruption))
| (package(=editor) & (test(=editor_tests::test_tab_in_leading_whitespace_auto_indents_for_bash) | test(=editor_tests::test_markdown_indents) | test(=editor_tests::test_indent_after_input_for_bash)))
| (package(=languages) & test(=typescript::tests::test_outline_with_destructuring))
| (package(=bongos_chat) & test(=runtime_tests::test_no_output_makes_a_chat_idle))
'''
retries = { backoff = "fixed", count = 2, delay = "2s" }

# The merge gates (script/bongos/test and test-all run this profile unless BONGOS_NEXTEST_PROFILE names
# another) run everything except the perf set: a test that asserts wall-clock time is kept out of a
# gate that runs while the machine is busy. Everything else (the retries above and the slow-timeout)
# is inherited from the default profile. Other nextest filters, names and -E expressions are
# intersected with `default-filter`; `--ignore-default-filter` runs the perf set under this profile.
[profile.gate]
default-filter = '''
not (
(package(=bongos_minibuffer_model) & test(perf_tests::))
| (package(=bongos_isearch) & test(perf_tests::))
| (package(=bongos_workflow) & (test(=runtime_tests::halt_ends_a_child_that_ignores_sigterm_within_five_seconds) | test(=runtime_tests::cancel_stops_processes_and_closes_the_run) | test(=runtime_tests::stop_kills_a_child_left_in_the_group_when_the_leader_exits_on_sigterm) | test(=runtime_tests::an_orphan_group_is_killed_even_when_its_leader_exits_on_sigterm) | test(=lifecycle_tests::gates_tests::a_gate_shows_needs_you_on_the_leaf_and_every_ancestor_while_another_branch_runs)))
)
'''

# `cargo nextest run --profile perf` (or BONGOS_NEXTEST_PROFILE=perf with test-all) runs only the perf
# set, one test at a time. The `perf-timing` group above still applies (a custom profile inherits the
# default profile's overrides). This profile's own override comes first, so best of 3 (one run and
# 2 retries) wins over the default profile's 3 retries. The JUnit report, with the output of passing
# tests, is target/nextest/perf/junit.xml under the repository root (nextest keeps it there even when
# CARGO_TARGET_DIR points elsewhere).
[profile.perf]
default-filter = '''
(package(=bongos_minibuffer_model) & test(perf_tests::))
| (package(=bongos_isearch) & test(perf_tests::))
| (package(=bongos_workflow) & (test(=runtime_tests::halt_ends_a_child_that_ignores_sigterm_within_five_seconds) | test(=runtime_tests::cancel_stops_processes_and_closes_the_run) | test(=runtime_tests::stop_kills_a_child_left_in_the_group_when_the_leader_exits_on_sigterm) | test(=runtime_tests::an_orphan_group_is_killed_even_when_its_leader_exits_on_sigterm) | test(=lifecycle_tests::gates_tests::a_gate_shows_needs_you_on_the_leaf_and_every_ancestor_while_another_branch_runs)))
'''
test-threads = 1
success-output = "final"

[[profile.perf.overrides]]
filter = "all()"
retries = { backoff = "fixed", count = 2, delay = "1s" }

[profile.perf.junit]
path = "junit.xml"
store-success-output = true
