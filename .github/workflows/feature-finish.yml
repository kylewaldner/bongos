# One run finishes one feature whose steps are all merged into topic/<dir>. Started by ticket-triage with `gh workflow
# run feature-finish.yml -f ticket=<feature dir>` (plus the redirect inputs only when they are not their production
# default). The run name ends with the ticket as its last word: triage ties a run to its ticket by it.
#
# The job is the local finish job (run.py --runner --kind finish, on the runner-finisher row while the finisher
# setting is on, else on runner-main): three opus reviewers, UI
# verification when the feature has a design directory, gate.py light --fmt-all, then gate.py full --baseline, then
# merge_main.py under refs/locks/main-merge. When the baseline rules call for the whole suite it runs here, in one
# build on this runner (the frame installs mesa-vulkan-drivers, which the GPU tests need; the runner test exclusion
# list reaches nextest through the entry script). Incremental builds are off. A finish that returns (findings left
# after its fix rounds) records a fix step and cedes with that step as next: triage then starts feature-implement,
# and feature-finish again once the fix step merged.
# The frame (claim, setup, snapshots, final step) is the pipeline-job action.
#
# Caps are triage's (cap.feature-finish). The concurrency group is the one feature-implement uses, so a finish and an
# implement run of one ticket never overlap.
name: feature-finish
run-name: feature-finish ${{ inputs.ticket || '90-zz-test-baseline' }}

on:
  push:
    branches: [gh-runners-test-c7-finish]
    paths: ['.github/workflows/feature-finish.yml']
  workflow_dispatch:
    inputs:
      ticket:
        description: "The feature directory, for example 17-navigation-pickers"
        required: true
        type: string
      coord_ref:
        description: "Branch of the coordination repository with the pipeline code (main in production)"
        default: main
        type: string
      coord_base:
        description: "Branch of the coordination repository that claim and docs pull requests target (main in production)"
        default: main
        type: string
      app_base:
        description: "Branch of this repository that is checked out and that the finish merges into (main in production)"
        default: main
        type: string
      state_prefix:
        description: "Prefix of state branches, lock, signal and wip refs (empty in production)"
        default: ''
        type: string
      index_tag:
        description: "Release tag of the code search index"
        default: colgrep-index
        type: string

permissions:
  contents: read

concurrency:
  group: feature-${{ inputs.state_prefix || 'zz-testc7f/' }}${{ inputs.ticket || '90-zz-test-baseline' }}
  cancel-in-progress: false

jobs:
  finish:
    name: finish
    runs-on: ubuntu-24.04
    # run.py stops at 300 minutes; the final step ends by about 329 (see job.sh's time line).
    timeout-minutes: 345
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pipeline-job
        with:
          kind: finish
          ticket: ${{ inputs.ticket || '90-zz-test-baseline' }}
          build: 'true'
          # The finisher's builds are unified-on (lanes.toml), so this restores cache-warm's dev-unified-ubuntu-24.04
          # cache, which exists; incremental is off (the action's auto for every kind but step).
          cache_variant: dev  # test only (c7f): the test protocol.conf sets unified_features false
          runner_image: ubuntu-24.04
          claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          coord_token: ${{ secrets.COORD_TOKEN }}
          coord_repo: ${{ secrets.COORD_REPO }}
          coord_ref: ${{ inputs.coord_ref || 'c7-code' }}
          coord_base: ${{ inputs.coord_base || 'gh-runners-test-base-c7f' }}
          app_base: ${{ inputs.app_base || 'gh-runners-test-base-c7f' }}
          state_prefix: ${{ inputs.state_prefix || 'zz-testc7f/' }}
          index_tag: ${{ inputs.index_tag || 'colgrep-index-test' }}
          colgrep_version: ${{ vars.COLGREP_VERSION }}  # the index workflows' pin
