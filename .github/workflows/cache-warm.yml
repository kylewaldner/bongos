# Builds the dependency caches that the pipeline jobs restore, and the only workflow that writes one. Three caches,
# one per build variant the jobs use: dev and test, dev and test with unified features, and release. A cache is
# saved only after its build succeeds (no cache-on-failure) and only on main. Every other job restores with
# save-if false. Workspace crates are never cached (rust-cache removes them before saving).
#
# Every job that restores one of these caches must set the same CARGO_*, RUST* and BONGOS_* values as this
# workflow before its cache step (rust-cache hashes them into the key), including CARGO_BUILD_JOBS on release and no
# CARGO_TERM_COLOR (color is passed as --color never instead).
# The environment of each build is what script/bongos/env.sh sets, written to GITHUB_ENV before the cache step, so
# the cache key sees the same values a job that sources env.sh would. A job that restores one of these caches must
# set the same values before its cache step, with the same shared-key and the same workspaces path.
name: cache-warm

on:
  push:
    branches: [gh-runners-test-c3-finish]
    paths:
      - '.github/workflows/cache-warm.yml'
  schedule:
    # Twice a week, so the 7-day eviction never empties the caches.
    - cron: '23 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm-c3-finish-test
  cancel-in-progress: false

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          # dev runs on the release job's runner (ubuntu-22.04), where the whole suite is built, so the toolchain, glibc and
          # system libraries match; mold is installed and used there (stage 11 must do the same for its suite step).
          - {name: dev-unified, runner: ubuntu-24.04, unified: '1', release: ''}
    name: warm-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 345
    env:
      BONGOS_WORKSPACE: /mnt/bongos-workspace
      BONGOS_UNIFIED_FEATURES: ${{ matrix.unified }}
      BONGOS_RELEASE_BUILD: ${{ matrix.release }}
      # The dev variants have no debug info on runners (env.sh); every job that restores them sets the same
      BONGOS_NO_DEBUGINFO: ${{ matrix.release != '1' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space (preinstalled software the build does not use)
        run: |
          set -u
          df -h / /mnt
          start=$(date +%s)
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda /usr/lib/google-cloud-sdk \
            /opt/az /opt/microsoft /usr/lib/firefox /opt/google /usr/local/share/chromium /home/linuxbrew \
            /usr/local/aws-cli /usr/local/julia*
          sudo docker system prune -af > /dev/null 2>&1 || true
          echo "removal took $(( $(date +%s) - start )) s"
          df -h / /mnt
      - name: Add a swap file (release only)
        if: matrix.release == '1'
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /swap-extra
          sudo chmod 600 /swap-extra
          sudo mkswap /swap-extra > /dev/null
          sudo swapon /swap-extra
          free -m
      - name: Install build dependencies
        run: |
          set -euo pipefail
          extra=''
          if [ -z "$BONGOS_RELEASE_BUILD" ]; then extra=mold; fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libva-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev make cmake clang lld \
            llvm jq git curl gettext-base elfutils libsqlite3-dev musl-tools musl-dev build-essential \
            pkg-config python3 $extra > /dev/null
          # Ubuntu ships llvm-objcopy only with a version suffix; the release bundle calls it unversioned.
          if ! command -v llvm-objcopy > /dev/null; then
            sudo ln -s "$(ls /usr/bin/llvm-objcopy-* | sort -V | tail -n1)" /usr/local/bin/llvm-objcopy
          fi
      - name: Install the Rust toolchain and set the build environment
        run: |
          set -euo pipefail
          sudo mkdir -p "$BONGOS_WORKSPACE"
          sudo chown "$USER" "$BONGOS_WORKSPACE"
          export RUSTUP_HOME="$BONGOS_WORKSPACE/rustup" CARGO_HOME="$BONGOS_WORKSPACE/cargo"
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          rustup toolchain install
          if [ -n "$BONGOS_RELEASE_BUILD" ]; then echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"; fi
          # shellcheck disable=SC1091
          . script/bongos/env.sh
          env | grep -E '^(CARGO_|RUSTUP_HOME=|RUSTC_BOOTSTRAP=|BONGOS_|CC=|CXX=)' | grep -v '^CARGO_BUILD_JOBS=' >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "rel=$(realpath -m --relative-to="$GITHUB_WORKSPACE" "$CARGO_TARGET_DIR")" >> "$RUNNER_TEMP/rel"
      - name: Find the target directory relative to the checkout
        id: target
        run: cat "$RUNNER_TEMP/rel" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          # The target directory is outside the checkout; rust-cache joins it onto the workspace path, so it is
          # given relative to the checkout. The cache action sets CARGO_INCREMENTAL=0; every variant is built that way.
          workspaces: ". -> ${{ steps.target.outputs.rel }}"
          # The runner is part of the key: a cache built on one image is not restored on another.
          shared-key: ${{ matrix.name }}-${{ matrix.runner }}
          add-job-id-key: false
          # Written only by this workflow, only on main, and (by default) only after a successful job.
          save-if: ${{ github.ref == 'refs/heads/gh-runners-test-c3-finish' }}
      - name: Build the dependencies (dev and test)
        if: matrix.release != '1'
        run: |
          set -euo pipefail
          cargo test --workspace --lib --bins --tests --locked --no-run --color never
          cargo build -p bongos -p cli --locked --color never
      - name: Build the dependencies (release, the real bundle build)
        if: matrix.release == '1'
        run: |
          set -euo pipefail
          # The variables are already in GITHUB_ENV; bundle-linux sources env.sh itself, which needs these directories.
          mkdir -p "$BONGOS_SMOKE_SCRATCH" "$BONGOS_TMPDIR"
          script/bongos/bundle-linux --out "$RUNNER_TEMP/dist"
      - name: Sizes
        if: always()
        run: |
          du -sm "$CARGO_TARGET_DIR" "$CARGO_HOME" 2>/dev/null || true
          df -h / /mnt
