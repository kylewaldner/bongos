# Fixes one entry of the flaky-fix queue (queue `flaky`, job kind `flaky_fix`): the local flaky-fix job with the
# flaky_fix.md prompt (reproduce, fix, the gates with the whole suite in this job, opus review, merge into
# the base branch through merge_main.py), followed by the 20-run judgment, which runs inside the job (run.py's runner
# mode: the fix's merge commit is checked out in the warm workspace and its test runs alone 20 times; 20 of 20 closes
# the entry, anything less is a failed attempt). Releases do not run on a flaky-fix merge, so nothing else judges it.
#
# Started by ticket-triage (`workflow_dispatch` with the queue entry); never by a push. Everything the job does is the
# pipeline-job frame: claim (`flaky-<entry id>`), run, final step. The queue is read from the coordination
# repository, which the frame clones from the COORD_REPO secret, so nothing here names it.
#
# Concurrency: one run at a time (runner.toml cap.flaky-fix = 1, enforced by triage), never cancelled in progress.
# Caps and switches live in runner.toml; with dispatch_enabled off triage starts nothing.
name: flaky-fix

# A run's display title ends with its ticket as the last word (triage matches runs to tickets by it); a queue ticket
# is `<queue>-<entry id lowercased>`.
run-name: flaky-fix flaky-zz-test-ff-20261124t140000z

on:
  push:
    branches: [gh-runners-test-fixes]
    paths: ['.github/workflows/flaky-fix.yml']
  workflow_dispatch:
    inputs:
      ticket:
        description: "The ticket, flaky-<entry id lowercased> (the run's display name; the entry input is what the job claims)"
        required: true
        type: string
      queue:
        description: "The queue: flaky"
        required: false
        default: flaky
        type: string
      entry:
        description: "The entry id as plans/FLAKY-FIXES.md writes it, in its own case (FF-20261124T105626Z)"
        required: true
        type: string
      # The five places a job writes. Production defaults; a test run sets all of them to its test values.
      coord_ref:
        description: "Branch of the coordination repository the job checks out for pipeline code"
        default: main
        type: string
      coord_base:
        description: "Branch of the coordination repository that claim, queue and fix pull requests target"
        default: main
        type: string
      app_base:
        description: "Branch of this repository that the fix merges into"
        default: main
        type: string
      state_prefix:
        description: "Prefix of state branches, lock and signal refs and wip snapshot branches"
        default: ''
        type: string
      index_tag:
        description: "Release tag that holds the code search index"
        default: colgrep-index
        type: string

permissions:
  contents: read

concurrency:
  group: flaky-fix
  cancel-in-progress: false

jobs:
  job:
    name: flaky-fix
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: read
    steps:
      # Only loads the action; the action checks the workspace out again at app_base with full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the inputs
        env:
          IN_TICKET: flaky-zz-test-ff-20261124t140000z
          IN_QUEUE: flaky
          IN_ENTRY: zz-test-FF-20261124T140000Z
        run: |
          set -euo pipefail
          if [ "$IN_QUEUE" != flaky ]; then
            echo "::error::flaky-fix takes the flaky queue; got '$IN_QUEUE'"
            exit 1
          fi
          case "$IN_ENTRY" in
            ''|*[!A-Za-z0-9-]*) echo "::error::entry is not a queue entry id"; exit 1 ;;
          esac
          want=$(printf 'flaky-%s' "$IN_ENTRY" | tr '[:upper:]' '[:lower:]')
          if [ "$IN_TICKET" != "$want" ]; then
            echo "::error::ticket '$IN_TICKET' is not the lowercase form of flaky-$IN_ENTRY"
            exit 1
          fi

      - uses: ./.github/actions/pipeline-job
        with:
          kind: flaky_fix
          # the entry id keeps its own case: the claim and the state branch match it exactly
          ticket: ${{ format('flaky-{0}', 'zz-test-FF-20261124T140000Z') }}
          claude_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          coord_token: ${{ secrets.COORD_TOKEN }}
          coord_repo: ${{ secrets.COORD_REPO }}
          coord_ref: github-runners-build
          coord_base: gh-runners-test-base-14
          app_base: gh-runners-test-base-14
          state_prefix: zz-test14/
          index_tag: colgrep-index-test
          colgrep_version: ${{ vars.COLGREP_VERSION }}  # the index workflows' pin
          # Builds on the dependency cache of the unified-features dev build (cache-warm's dev-unified-ubuntu-24.04),
          # read only; no incremental builds (the action's default for every kind but step).
          cache_variant: dev-unified
          runner_image: ubuntu-24.04
# retry
