[package]
name = "bongos_builder"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/bongos_builder.rs"
doctest = false

[dependencies]
anyhow.workspace = true
bongos_builder_model.workspace = true
bongos_chat.workspace = true
bongos_prompts.workspace = true
bongos_work.workspace = true
command_palette_hooks.workspace = true
editor.workspace = true
fs.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
menu.workspace = true
paths.workspace = true
project.workspace = true
settings.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
bongos_work_model = { workspace = true, features = ["test-support"] }
db = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
# Like bongos_prompts: `project` and `workspace` are only lint-clean together under test-support.
project = { workspace = true, features = ["test-support"] }
release_channel.workspace = true
remote = { workspace = true, features = ["test-support"] }
rpc = { workspace = true, features = ["test-support"] }
semver.workspace = true
serde_json.workspace = true
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
terminal = { workspace = true, features = ["test-support"] }
terminal_view = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
