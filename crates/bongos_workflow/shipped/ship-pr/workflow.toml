schema = 1
name = "ship PR"
description = "Rebase when the parent PR merged, wait for CI and fix it, ask before merging, merge and wait for the deploy"
start = "rebase"

[inputs]
pr = { type = "text", from = "task.pr" }

[defaults]
agent = "claude"
model = "sonnet"
permission_mode = "acceptEdits"
allowed_tools = [
  "Read",
  "Edit",
  "Write",
  "Glob",
  "Grep",
  "Bash(git diff:*)",
  "Bash(git status:*)",
  "Bash(git add:*)",
  "Bash(git commit:*)",
  "Bash(git rebase --continue:*)",
  "Bash(gh pr checks:*)",
  "Bash(gh run view:*)",
  "Bash(cargo test:*)",
  "Bash(gradle test:*)",
  "Bash(npm test:*)",
  "Bash(make test:*)",
]
max_turns = 40
max_cost_usd = 5.0
max_minutes = 30
retries = 2

# Rebases first, so CI runs on the branch that will merge.
[nodes.rebase]
kind = "program"
purpose = "Rebase the branch when the parent PR has merged"
script = "rebase_if_parent_merged.py"
language = "python"
permissions = { commands = ["gh", "git"], network = ["github.com", "*.github.com"], mcp = [] }
output = { result = { type = "choice", values = ["unchanged", "rebased", "conflict"] } }
routes = [
  { when = { result = "unchanged" }, to = "ci" },
  { when = { result = "rebased" }, to = "ci" },
  { when = { result = "conflict" }, to = "resolve" },
]

[nodes.resolve]
kind = "agent"
purpose = "Resolve the rebase conflicts"
prompt = "resolve.md"
output = { summary = { type = "text" } }
routes = [{ to = "push" }]

[nodes.push]
kind = "program"
purpose = "Push the branch to the pull request"
script = "push.py"
language = "python"
permissions = { commands = ["gh", "git"], network = ["github.com", "*.github.com"], mcp = [] }
output = { result = { type = "choice", values = ["pushed", "rejected"] } }
routes = [
  { when = { result = "pushed" }, to = "ci" },
  { when = { result = "rejected" }, to = "rejected" },
]

# `waiting` never routes: while the script reports it the node sleeps and checks again with no
# agent running, and the run gives up after workflows.wait_give_up_days.
[nodes.ci]
kind = "program"
purpose = "Wait for CI and report green, red or waiting"
script = "check_ci.py"
language = "python"
permissions = { commands = ["gh"], network = ["github.com", "*.github.com"], mcp = [] }
polls = { value = "waiting" }
output = { result = { type = "choice", values = ["green", "red", "waiting"] } }
routes = [
  { when = { result = "green" }, to = "merge" },
  { when = { result = "red" }, to = "fix", max_passes = 5, on_bound = "red_ci" },
  { when = { result = "waiting" }, to = "waiting" },
]

[nodes.fix]
kind = "agent"
purpose = "Fix the failing CI checks"
prompt = "fix.md"
output = { summary = { type = "text" } }
routes = [{ to = "push" }]

[nodes.merge]
kind = "program"
purpose = "Merge the pull request"
script = "merge_pr.py"
language = "python"
gate = { when = "before", question = "CI is green. Merge this pull request?" }
permissions = { commands = ["gh"], network = ["github.com", "*.github.com"], mcp = [] }
with = { method = "squash" }
output = { result = { type = "choice", values = ["merged", "blocked"] } }
routes = [
  { when = { result = "merged" }, to = "deploy" },
  { when = { result = "blocked" }, to = "blocked" },
]

# Satisfied at once when merging ships the task; otherwise it asks Kyle to confirm the deploy.
[nodes.deploy]
kind = "program"
purpose = "Wait for the deploy"
use = "wait"
with = { condition = "deploy", pr = "{{inputs.pr}}" }
polls = { value = "waiting" }
output = { result = { type = "choice", values = ["satisfied", "waiting"] } }
routes = [
  { when = { result = "satisfied" }, to = "done" },
  { when = { result = "waiting" }, to = "waiting" },
]

[ends.done]
kind = "success"

[ends.rejected]
kind = "failure"
reason = "the push was rejected; the pull request branch has changes this run does not have"

[ends.red_ci]
kind = "failure"
reason = "CI is still red after five fix passes"

[ends.blocked]
kind = "failure"
reason = "the pull request could not be merged"

[ends.waiting]
kind = "failure"
reason = "gave up waiting"
