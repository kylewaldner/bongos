schema = 1
name = "implement PR"
description = "Triage, plan, fan out over work items, test and review"
start = "triage"

[inputs]
goal = { type = "text", from = "task.goal" }
plan = { type = "path", from = "task.plan", required = false }

[defaults]
agent = "claude"
model = "sonnet"
permission_mode = "acceptEdits"
allowed_tools = [
  "Read",
  "Edit",
  "Write",
  "Glob",
  "Grep",
  "Bash(git diff:*)",
  "Bash(git status:*)",
  "Bash(git add:*)",
  "Bash(git commit:*)",
  "Bash(cargo test:*)",
  "Bash(gradle test:*)",
  "Bash(npm test:*)",
  "Bash(make test:*)",
]
max_turns = 40
max_cost_usd = 5.0
max_minutes = 30
retries = 2

[nodes.triage]
kind = "agent"
purpose = "Decide one-shot or planned"
prompt = "triage.md"
output = { mode = { type = "choice", values = ["one-shot", "planned"] }, why = { type = "text" } }
routes = [
  { when = { mode = "one-shot" }, to = "implement" },
  { when = { mode = "planned" }, to = "plan" },
]

[nodes.plan]
kind = "agent"
purpose = "Write a short design and list the work items"
prompt = "plan.md"
output = { items = { type = "list", of = "text" }, design = { type = "path", outcome = "document" } }
routes = [{ fan_out = { over = "items", to = "implement_item", width = 8 } }]

[nodes.implement]
kind = "agent"
purpose = "Implement the whole goal in one pass"
prompt = "implement.md"
output = { summary = { type = "text" } }
routes = [{ to = "test" }]

[nodes.implement_item]
kind = "agent"
purpose = "Implement one work item"
prompt = "implement_item.md"
output = { summary = { type = "text" } }
routes = [{ to = "test" }]

[nodes.test]
kind = "program"
purpose = "Run the project's tests"
join = { wait = "all" }
script = "run_tests.py"
language = "python"
permissions = { commands = ["cargo", "gradle", "npm", "make"], network = [], mcp = [] }
output = { status = { type = "choice", values = ["pass", "fail"] }, log = { type = "text", optional = true } }
routes = [
  { when = { status = "pass" }, to = "review" },
  { when = { status = "fail" }, to = "fix", max_passes = 3, on_bound = "stuck_tests" },
]

[nodes.fix]
kind = "agent"
purpose = "Fix what the tests or the review found"
prompt = "fix.md"
output = { summary = { type = "text" } }
routes = [{ to = "test" }]

[nodes.review]
kind = "agent"
purpose = "Review the change against the goal"
prompt = "review.md"
model = "claude-opus-5-5"
gate = { when = "after", question = "Ship this?" }
output = { verdict = { type = "choice", values = ["approve", "changes"] }, pr = { type = "text", outcome = "pr" } }
routes = [
  { when = { verdict = "approve" }, to = "merge" },
  { when = { verdict = "changes" }, to = "fix", max_passes = 3, on_bound = "stuck_review" },
]

[nodes.merge]
kind = "program"
purpose = "Bring the run branch into the task branch"
use = "merge"
with = { style = "ff-or-merge" }
output = { result = { type = "choice", values = ["merged", "conflict"] } }
routes = [
  { when = { result = "merged" }, to = "done" },
  { when = { result = "conflict" }, to = "stuck" },
]

[ends.done]
kind = "success"
outcomes = ["pr"]

[ends.stuck]
kind = "failure"
reason = "merge conflict needs a hand"

[ends.stuck_tests]
kind = "failure"
reason = "the tests still fail after three fix passes"

[ends.stuck_review]
kind = "failure"
reason = "the review still asks for changes after three fix passes"
