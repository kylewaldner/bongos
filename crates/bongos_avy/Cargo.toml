[package]
name = "bongos_avy"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
test-support = [
    "dep:multi_buffer",
    "dep:project",
    "dep:theme",
    "dep:theme_settings",
    "dep:ui",
    "bongos_window/test-support",
    "editor/test-support",
    "gpui/test-support",
    "multi_buffer/test-support",
    "project/test-support",
    "workspace/test-support",
]

[lib]
path = "src/bongos_avy.rs"
doctest = false

[dependencies]
bongos_avy_model.workspace = true
bongos_emacs.workspace = true
bongos_window.workspace = true
command_palette_hooks.workspace = true
editor.workspace = true
gpui.workspace = true
workspace.workspace = true
multi_buffer = { workspace = true, optional = true }
project = { workspace = true, optional = true }
theme = { workspace = true, optional = true }
theme_settings = { workspace = true, optional = true }
ui = { workspace = true, optional = true }

[dev-dependencies]
bongos_window = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
multi_buffer = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
workspace = { workspace = true, features = ["test-support"] }
