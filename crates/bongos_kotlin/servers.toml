# Pinned Kotlin language servers, embedded in the binary. Refresh with script/bongos/pin-kotlin-servers
# (needs the network; never run by a gate). Every download is checked against `sha256` before it is
# extracted, and bongos never asks a server what the newest version is.
#
# kotlin-lsp builds are early access and expire about 29 days after `built`; `expires` is the last
# day the build runs (`license status` prints it). Pin a newer build before then.

[kotlin-lsp]
version = "263.7084.0"
built = "2026-10-14"
expires = "2026-11-12"
args = ["--stdio", "--data-sharing=none", "--region=americas"]

[kotlin-lsp.env]
INTELLIJ_UPDATES_ENABLED = "false"

[kotlin-lsp.platform.linux-x64]
url = "https://download.jetbrains.com/language-server/kotlin-server/263.7084.0/kotlin-server-263.7084.0.tar.gz"
sha256 = "ae0c4b01e17ab73a4a5227a78ea99e6dcbe3e499600315b22759a4e4cddd11df"
archive = "tar.gz"
strip_components = 1
launcher = "bin/intellij-server"
runtime = "jbr/bin/java"

[kotlin-lsp.platform.linux-arm64]
url = "https://download.jetbrains.com/language-server/kotlin-server/263.7084.0/kotlin-server-263.7084.0-aarch64.tar.gz"
sha256 = "450ab7c1d80e48106aa429b48cb4226d82ca12a8a2400447ae02386794780cac"
archive = "tar.gz"
strip_components = 1
launcher = "bin/intellij-server"
runtime = "jbr/bin/java"

[kotlin-lsp.platform.macos-arm64]
url = "https://download.jetbrains.com/language-server/kotlin-server/263.7084.0/kotlin-server-263.7084.0-aarch64.sit"
sha256 = "b403bf8a54bd458e3ba6731cf8abb3340be08b439c03576dfc02b13faf3694b8"
archive = "zip"
strip_components = 1
launcher = "bin/intellij-server"
runtime = "jbr/Contents/Home/bin/java"

[kotlin-lsp.platform.macos-x64]
url = "https://download.jetbrains.com/language-server/kotlin-server/263.7084.0/kotlin-server-263.7084.0.sit"
sha256 = "b29c393a5e541153d03d626e7946268437e358a667a5f914a126dbb4007664b1"
archive = "zip"
strip_components = 1
launcher = "bin/intellij-server"
runtime = "jbr/Contents/Home/bin/java"

# The IntelliJ server is a stable build (no expiry). Its start also needs `--eula=<hash>`, added at
# run time once the user has accepted the EULA.
[intellij]
version = "271.2085.0"
args = ["--stdio", "--data-sharing=none", "--region=americas"]

[intellij.env]
INTELLIJ_UPDATES_ENABLED = "false"

