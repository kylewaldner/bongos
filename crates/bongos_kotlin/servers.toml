# Pinned Kotlin language servers, embedded in the binary. Refresh with script/bongos/pin-kotlin-servers
# (needs the network; never run by a gate). Every download is checked against `sha256` before it is
# extracted, and bongos never asks a server what the newest version is.
#
# kotlin-lsp builds are early access and expire about 29 days after `built`; `expires` is the last
# day the build runs (`license status` prints it). Pin a newer build before then.

[kotlin-lsp]
version = "271.2085.0"
built = "2026-11-04"
expires = "2026-12-03"
args = ["--stdio", "--data-sharing=none", "--region=americas"]

[kotlin-lsp.env]
INTELLIJ_UPDATES_ENABLED = "false"

[kotlin-lsp.platform.linux-x64]
url = "https://download.jetbrains.com/language-server/kotlin-server/271.2085.0/kotlin-server-271.2085.0.tar.gz"
sha256 = "e398e799027f41749ea33faa57470307d13d40f910961858c7e30adbd778ae08"
archive = "tar.gz"
strip_components = 1
launcher = "bin/intellij-server"
runtime = "jbr/bin/java"

[kotlin-lsp.platform.linux-arm64]
url = "https://download.jetbrains.com/language-server/kotlin-server/271.2085.0/kotlin-server-271.2085.0-aarch64.tar.gz"
sha256 = "877aee612a17dab48144466282a6414ec58ab428a10b97c7e13edd9b6b3dc96e"
archive = "tar.gz"
strip_components = 1
launcher = "bin/intellij-server"
runtime = "jbr/bin/java"

[kotlin-lsp.platform.macos-arm64]
url = "https://download.jetbrains.com/language-server/kotlin-server/271.2085.0/kotlin-server-271.2085.0-aarch64.sit"
sha256 = "2d22388f58be6f4dfa7a8f18c1e231871164dcacc16e407559029d7232816b4a"
archive = "zip"
strip_components = 1
launcher = "bin/intellij-server"
runtime = "jbr/Contents/Home/bin/java"

[kotlin-lsp.platform.macos-x64]
url = "https://download.jetbrains.com/language-server/kotlin-server/271.2085.0/kotlin-server-271.2085.0.sit"
sha256 = "68457ab1825331e3eac85191b7c32737cbd8993867f5a9c50dfe012c5509e8f7"
archive = "zip"
strip_components = 1
launcher = "bin/intellij-server"
runtime = "jbr/Contents/Home/bin/java"

# The IntelliJ server is a stable build (no expiry). Its start also needs `--eula=<hash>`, added at
# run time once the user has accepted the EULA.
[intellij]
version = "271.2085.0"
args = ["--stdio", "--data-sharing=none", "--region=americas"]

[intellij.env]
INTELLIJ_UPDATES_ENABLED = "false"

