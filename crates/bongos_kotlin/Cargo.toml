[package]
name = "bongos_kotlin"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/bongos_kotlin.rs"
doctest = false

[[bin]]
name = "bongos-fake-kotlin-server"
path = "src/bin/fake_kotlin_server.rs"

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
async-fs.workspace = true
async-tar.workspace = true
