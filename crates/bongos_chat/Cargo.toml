[package]
name = "bongos_chat"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/bongos_chat.rs"
doctest = false

[dependencies]
bongos_chat_model.workspace = true
bongos_work.workspace = true
bongos_work_model.workspace = true
command_palette_hooks.workspace = true
editor.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
project.workspace = true
settings.workspace = true
task.workspace = true
terminal.workspace = true
util.workspace = true
uuid.workspace = true
which.workspace = true
workspace.workspace = true

[dev-dependencies]
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
# Like bongos_work: `project` and `workspace` are only lint-clean together under test-support
# (`project` builds its `Collab` state there, `workspace` matches the mock remote), so linting this
# crate alone fails without these.
project = { workspace = true, features = ["test-support"] }
release_channel.workspace = true
remote = { workspace = true, features = ["test-support"] }
rpc = { workspace = true, features = ["test-support"] }
semver.workspace = true
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
terminal = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true
